name: Build APK

# Builds the native Rust client for every Android ABI, then assembles the app
# and publishes the APKs as a pre-release so they can be downloaded by link.

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native client (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
          - abi: armeabi-v7a
            triple: armv7-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client -> ../build/native
          key: ${{ matrix.abi }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          cargo install cargo-ndk --locked

      - name: Locate Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          test -d "$ndk"
          echo "Using NDK: $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Build libclient.so
        working-directory: rust-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/native
        run: cargo +1.97.1 ndk -t ${{ matrix.abi }} -P 26 build --release --locked

      - name: Collect library
        run: |
          mkdir -p "out/${{ matrix.abi }}"
          cp "build/native/${{ matrix.triple }}/release/client" "out/${{ matrix.abi }}/libclient.so"
          ls -l "out/${{ matrix.abi }}"

      - uses: actions/upload-artifact@v7
        with:
          name: libclient-${{ matrix.abi }}
          path: out
          if-no-files-found: error
          retention-days: 3

  apk:
    name: Android APK
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          pattern: libclient-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Check native libraries
        run: |
          ls -lR app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/jniLibs/$abi/libclient.so"
          done

      - name: Prepare Android SDK
        run: |
          # The committed local.properties holds a placeholder Windows path.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0" \
            || "$sdkmanager" --channel=3 "platforms;android-37" \
            || echo "Platform 37 not installed by sdkmanager; Gradle will try to fetch it."

      - name: Build debug APK
        run: bash gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          tag="build-${{ github.run_number }}"
          mkdir -p dist
          ls -l app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-universal-debug.apk "dist/app-universal-$tag.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "dist/app-arm64-$tag.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build ${{ github.run_number }}" \
            --notes "Automatic test build from commit $GITHUB_SHA. Debug-signed, for testing only."
