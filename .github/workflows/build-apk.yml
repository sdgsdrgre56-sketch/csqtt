name: Build APK

# Builds the native Rust client for every Android ABI, then assembles the
# signed release APK and publishes it as a pre-release so it can be downloaded by link.

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native client (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
          - abi: armeabi-v7a
            triple: armv7-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7

      # The native client only changes when rust-client/ changes, so reuse the
      # previously built library instead of compiling it again on every push.
      - id: libcache
        uses: actions/cache@v5
        with:
          path: out
          key: libclient-${{ matrix.abi }}-${{ hashFiles('rust-client/**') }}

      - uses: dtolnay/rust-toolchain@master
        if: steps.libcache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        if: steps.libcache.outputs.cache-hit != 'true'
        with:
          workspaces: rust-client -> ../build/native
          key: ${{ matrix.abi }}

      - name: Install build tools
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          cargo install cargo-ndk --locked

      - name: Locate Android NDK
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          test -d "$ndk"
          echo "Using NDK: $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Build libclient.so
        if: steps.libcache.outputs.cache-hit != 'true'
        working-directory: rust-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/native
        run: cargo +1.97.1 ndk -t ${{ matrix.abi }} -P 26 build --release --locked

      - name: Collect library
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "out/${{ matrix.abi }}"
          cp "build/native/${{ matrix.triple }}/release/client" "out/${{ matrix.abi }}/libclient.so"

      - name: Check library
        run: |
          ls -l "out/${{ matrix.abi }}"
          test -s "out/${{ matrix.abi }}/libclient.so"

      - uses: actions/upload-artifact@v7
        with:
          name: libclient-${{ matrix.abi }}
          path: out
          if-no-files-found: error
          retention-days: 3

  apk:
    name: Android APK
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAYAK_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          pattern: libclient-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Check native libraries
        run: |
          ls -lR app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/jniLibs/$abi/libclient.so"
          done

      - name: Prepare Android SDK
        run: |
          # The committed local.properties holds a placeholder Windows path.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0" \
            || "$sdkmanager" --channel=3 "platforms;android-37" \
            || echo "Platform 37 not installed by sdkmanager; Gradle will try to fetch it."

      - name: Select signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$SIGNING_KEYSTORE_PASSWORD"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "KEY_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
              echo "SIGNING_KIND=private"
            } >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets."
          else
            {
              echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/ci/test-signing.p12"
              echo "KEYSTORE_PASSWORD=mayak-test"
              echo "KEY_ALIAS=mayak-test"
              echo "KEY_PASSWORD=mayak-test"
              echo "SIGNING_KIND=test"
            } >> "$GITHUB_ENV"
            echo "Signing with the public TEST key (ci/test-signing.p12)."
          fi

      - name: Build release APK
        run: bash gradlew assembleRelease --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          ls -l app/build/outputs/apk/release
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/Mayak-$MAYAK_BUILD_NUMBER-universal.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/Mayak-$MAYAK_BUILD_NUMBER-arm64.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$MAYAK_BUILD_NUMBER"
          gh release create "$tag" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mayak build $MAYAK_BUILD_NUMBER" \
            --notes "Automatic build from commit $GITHUB_SHA. Signing key: $SIGNING_KIND."
