name: Pulsar

# Ядро «Пульсар» (сервер, клиент для ПК и телефона) и приложение для Android.
# Ядро выкладывается релизом pulsar-v<VERSION> один раз на версию (его скачивает
# server/install.sh); приложение — релизом pulsar-app-<номер сборки>.

on:
  workflow_dispatch:
  push:
    branches: [pulsar]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test (модель облака VK с настоящими задержками)
        run: go test -count=1 -v ./core/ 2>&1 | grep -E "^(=== RUN|--- |ok|FAIL|PASS)|ЗАГРУЗКА|ПОТОК|ОТДАЧА|СТРАНИЦ|восстанов|panic" ; test ${PIPESTATUS[0]} -eq 0
      - name: Build
        run: |
          V=$(cat VERSION)
          mkdir -p out
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o "out/$3" ./cmd/pulsar; }
          b linux amd64 pulsar-linux-amd64
          b linux arm64 pulsar-linux-arm64
          b windows amd64 pulsar-windows-amd64.exe
          cd out && sha256sum pulsar-* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: out/
      - name: Release (один раз на версию)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="pulsar-v$(cat VERSION)"
          if gh release view "$T" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $T уже есть — не трогаю"; exit 0
          fi
          gh release create "$T" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Пульсар $(cat VERSION) — ядро" \
            --notes "Сервер и клиент «Пульсар». Установка сервера: см. server/install.sh в ветке pulsar."

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" > /dev/null
      - name: Ядро для телефона (libpulsar.so)
        run: |
          V="$(cat VERSION)-app${{ github.run_number }}"
          J=android/app/src/main/jniLibs
          mkdir -p $J/arm64-v8a $J/armeabi-v7a out
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o $J/arm64-v8a/libpulsar.so ./cmd/pulsar
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o $J/armeabi-v7a/libpulsar.so ./cmd/pulsar
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o out/pulsar-windows-amd64.exe ./cmd/pulsar
      - name: tun2socks (hev-socks5-tunnel)
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/heiher/hev-socks5-tunnel hev/jni
          echo "hev-socks5-tunnel: $(git -C hev/jni rev-parse HEAD)"
          echo "--- JNI:"; grep -rn "TProxyStartService\|TProxyStopService\|TProxyGetStats\|PKGNAME\|CLSNAME" hev/jni/src/*jni* | head -20
          grep -rq '(Ljava/lang/String;I)Z' hev/jni/src/ || { echo "::error::подпись TProxyStartService изменилась — поправить TProxyService.java"; exit 1; }
          echo "--- Application.mk было:"; cat hev/jni/Application.mk || true
          cat android/hev/Application.mk >> hev/jni/Application.mk
          cd hev && "$ANDROID_HOME/ndk/27.0.12077973/ndk-build" -j4 > ndk.log 2>&1 || { tail -50 ndk.log; exit 1; }
          cd ..
          for a in arm64-v8a armeabi-v7a; do cp hev/libs/$a/libhev-socks5-tunnel.so android/app/src/main/jniLibs/$a/; done
          ls -la android/app/src/main/jniLibs/*
      - name: Подпись
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$SIGNING_KEYSTORE_PASSWORD"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Подпись своим ключом из секретов репозитория."
          else
            # постоянный ключ приложения из ветки: обновления ставятся поверх
            {
              echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/ci/pulsar-signing.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=pulsar-key"
              echo "ANDROID_KEY_ALIAS=pulsar"
              echo "ANDROID_KEY_PASSWORD=pulsar-key"
            } >> "$GITHUB_ENV"
            echo "Подпись ключом ci/pulsar-signing.p12."
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Сборка APK
        env:
          PULSAR_BUILD: ${{ github.run_number }}
        run: |
          gradle -p android --no-daemon assembleRelease
          N=${{ github.run_number }}
          for f in android/app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*) cp "$f" out/Pulsar-$N-arm64.apk ;;
              *armeabi-v7a*) cp "$f" out/Pulsar-$N-arm32.apk ;;
              *universal*) cp "$f" out/Pulsar-$N-universal.apk ;;
            esac
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify out/Pulsar-$N-arm64.apk
          ls -la out
      - name: Релиз приложения
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "pulsar-app-$N" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Пульсар — приложение, сборка $N" \
            --notes "Pulsar-$N-arm64.apk — для большинства телефонов. pulsar-windows-amd64.exe — ядро для Маяк Браузера."
